---
AWSTemplateFormatVersion: 2010-09-09
Description: >
  Creates IAM roles, policies, KMS keys, and an S3 bucket to support the migration from
  the source database into Amazon Aurora DSQL.


Parameters:

  DSQLClusterEndpoint:
    Description: The endpoint for the target Amazon Aurora DSQL database cluster
    Type: String
  
  DSQLClusterArn:
    Description: The ARN of the target Amazon Aurora DSQL database cluster
    Type: String

  LoaderJobCapacity:
    Description: The maximum capacity in AWS Glue data processing units (DPUs) that can be allocated to the Amazon Aurora DSQL loader job
    Type: Number
    Default: 10
    MinValue: 2
    MaxValue: 100

  ExportJobName:
    Description: The name of the database snapshot export job. This name should be unique in your account.
    Type: String
    Default: export-storefront

  SourceDatabaseName:
    Description: The name of the database our data is in
    Type: String
    Default: storefront

  SourceSchemaName:
    Description: The name of the database schema our source tables are in
    Type: String
    Default: sales


Resources:

  # @secure_recommendation: Dedicated logging bucket separate from the data bucket
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join ["-", ["storefront-logs", !Ref AWS::Region, !Ref AWS::AccountId]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  # @secure_recommendation: Restrict writes to S3 logging service only; deny non-TLS traffic
  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3LoggingDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${LogsBucket.Arn}/*"
            Condition:
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:s3:::storefront-${AWS::Region}-${AWS::AccountId}"
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt LogsBucket.Arn
              - !Sub "${LogsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  ExportBucket:
    Type: AWS::S3::Bucket
    DependsOn: LogsBucketPolicy
    Properties:
      BucketName: !Join ["-", ["storefront", !Ref AWS::Region, !Ref AWS::AccountId]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref LogsBucket
        LogFilePrefix: "logs/"
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: false
      AccessControl: Private

  # @secure_recommendation: Enforce HTTPS-only access to prevent data interception in transit
  ExportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExportBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ExportBucket.Arn
              - !Sub "${ExportBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  EmptyS3BucketFunctionPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: EmptyS3BucketFunctionPolicy
      RoleName: !Ref EmptyS3BucketFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "s3:DeleteObject"
              - "s3:DeleteObjectVersion"
              - "s3:ListBucket"
              - "s3:ListBucketVersions"
            Resource:
              - !GetAtt ExportBucket.Arn
              - !Sub '${ExportBucket.Arn}/*'
              - !GetAtt LogsBucket.Arn
              - !Sub '${LogsBucket.Arn}/*'

  EmptyS3BucketFunctionRole:
    Type: "AWS::IAM::Role"
    Properties:
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"

  EmptyS3BucketFunction:
    Type: "AWS::Lambda::Function"
    Properties:
      Description: "Deletes all objects and object versions from an S3 bucket"
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt EmptyS3BucketFunctionRole.Arn
      Code:
        ZipFile: |
          import cfnresponse
          import logging
          import boto3
          
          logger = logging.getLogger()
          logger.setLevel(logging.DEBUG)
          
          s3_client = boto3.client('s3')
          
          
          def handler(event, context):
              respond_to_cfn = not ('test' in event or (__name__ == "__main__"))
              response_data = {}
          
              if 'RequestType' not in event or event['RequestType'] != 'Delete':
                  if respond_to_cfn:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
                  return
          
              try:
                  #
                  # Validate inputs
                  #
                  if 'ResourceProperties' not in event:
                      logger.error("Invalid event:  event does not contain 'ResourceProperties'")
                      if respond_to_cfn:
                          cfnresponse.send(event, context, cfnresponse.FAILED, response_data)
                      return
          
                  parameters = event['ResourceProperties']
                  if 'Bucket' not in parameters or len(parameters['Bucket']) < 1:
                      logger.error("Bucket parameter not provided")
                      if respond_to_cfn:
                          cfnresponse.send(event, context, cfnresponse.FAILED, response_data)
                      return
          
                  #
                  # Do stuff
                  #
                  paginator = s3_client.get_paginator('list_object_versions')
                  iterator = paginator.paginate(Bucket=parameters['Bucket'])
                  for page in iterator:
                      obj_list = []
                      for version in page.get('Versions', []):
                          obj_list.append({'Key': version['Key'], 'VersionId': version['VersionId']})
                      for marker in page.get('DeleteMarkers', []):
                          obj_list.append({'Key': marker['Key'], 'VersionId': marker['VersionId']})
          
                      if obj_list:
                          rm_object = {'Quiet': False, 'Objects': obj_list}
                          s3_client.delete_objects(Bucket=parameters['Bucket'], Delete=rm_object)
          
                  if respond_to_cfn:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
          
                  return response_data
              except Exception:
                  logger.exception(event)
          
                  if respond_to_cfn:
                      cfnresponse.send(event, context, cfnresponse.FAILED, response_data)


  EmptyExportBucket:
    Type: Custom::EmptyLambdaCodeBucket
    DependsOn:
      - PutGlueJobCodeToS3
    Properties:
      ServiceToken: !GetAtt EmptyS3BucketFunction.Arn
      Bucket: !Ref ExportBucket

  EmptyLogsBucket:
    Type: Custom::EmptyLambdaCodeBucket
    Properties:
      ServiceToken: !GetAtt EmptyS3BucketFunction.Arn
      Bucket: !Ref LogsBucket

  S3ObjectPutterPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: S3ObjectPutterRolePolicy
      RoleName: !Ref S3ObjectPutterRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "s3:DeleteObject"
              - "s3:DeleteObjectVersion"
              - "s3:GetObject"
              - "s3:ListBucket"
              - "s3:ListBucketVersions"
              - "s3:PutObject"
            Resource:
              - !GetAtt ExportBucket.Arn
              - !Sub '${ExportBucket.Arn}/*'


  S3ObjectPutterRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"


  S3ObjectPutterFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Writes provided object content to S3"
      Runtime: python3.12
      Handler: index.handler
      MemorySize: 128
      Timeout: 300
      Role: !GetAtt S3ObjectPutterRole.Arn
      ReservedConcurrentExecutions: 1
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          
          s3 = boto3.client('s3')
          
          def delete_all_versions(bucket, key):
            paginator = s3.get_paginator('list_object_versions')
            pages = paginator.paginate(Bucket=bucket, Prefix=key)
            to_delete = []
            for page in pages:
              for v in page.get('Versions', []):
                if v['Key'] == key:
                  to_delete.append({'Key': v['Key'], 'VersionId': v['VersionId']})
              for m in page.get('DeleteMarkers', []):
                if m['Key'] == key:
                  to_delete.append({'Key': m['Key'], 'VersionId': m['VersionId']})
            if to_delete:
              s3.delete_objects(Bucket=bucket, Delete={'Quiet': True, 'Objects': to_delete})

          def handler(event, context):
            try:
              responseData = {}
                    
              if event['RequestType'] == 'Delete':
                delete_all_versions(event['ResourceProperties']['S3Bucket'], event['ResourceProperties']['S3Key'])
              elif event['RequestType'] == 'Create':          
                s3.put_object(Bucket=event['ResourceProperties']['S3Bucket'], Key=event['ResourceProperties']['S3Key'],
                              Body=event['ResourceProperties']['Body'].encode())
              elif event['RequestType'] == 'Update':
                  delete = False
                  if event['ResourceProperties']['S3Bucket'] != event['OldResourceProperties']['S3Bucket']:
                    delete = True
                  elif event['ResourceProperties']['S3Key'] != event['OldResourceProperties']['S3Key']:
                    delete = True
          
                  if delete:
                    s3.delete_object(Bucket=event['OldResourceProperties']['S3Bucket'], Key=event['OldResourceProperties']['S3Key'])
                    s3.put_object(Bucket=event['ResourceProperties']['S3Bucket'], Key=event['ResourceProperties']['S3Key'],
                              Body=event['ResourceProperties']['Body'].encode())
                  else:
                    if event['ResourceProperties']['Body'] != event['OldResourceProperties']['Body']:
                      s3.put_object(Bucket=event['ResourceProperties']['S3Bucket'], Key=event['ResourceProperties']['S3Key'],
                              Body=event['ResourceProperties']['Body'].encode())

              responseData['S3Url'] = 's3://{}/{}'.format(event['ResourceProperties']['S3Bucket'], event['ResourceProperties']['S3Key'])
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
            except Exception as e:
              print(e)
              reason = f"Exception thrown: {e}"
              cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=reason)


  PutGlueJobCodeToS3:
    Type: Custom::S3PutObject
    # Ensure the S3ObjectPutter Lambda's inline policy is attached before we
    # invoke it; otherwise the PutObject call can race the policy attachment
    # and fail with AccessDenied.
    DependsOn: S3ObjectPutterPolicy
    Properties:
      ServiceToken: !GetAtt S3ObjectPutterFunction.Arn
      S3Bucket:  !Ref ExportBucket
      S3Key:  'glue/migration.py'
      Body: |
        import boto3
        import sys

        from awsglue.transforms import *
        from awsglue.utils import getResolvedOptions
        from pyspark.context import SparkContext
        from awsglue.context import GlueContext
        from awsglue.dynamicframe import DynamicFrame
        from pyspark.sql import SparkSession
        from pyspark.sql import functions as func
        from pyspark.sql.functions import to_timestamp, to_date, col
        from awsglue.job import Job

        # Read job configuration parameters
        args = getResolvedOptions(sys.argv, ['JOB_NAME', 'dsql_endpoint', 'glue_database', 'schema'])

        # Job initializations
        dsql = boto3.client('dsql')
        sc = SparkContext()
        glueContext = GlueContext(sc)
        spark = glueContext.spark_session
        job = Job(glueContext)
        job.init(args['JOB_NAME'], args)

        # Read the exported snapshot tables from S3
        customers_df = glueContext.create_dynamic_frame_from_catalog(database=args['glue_database'], table_name=args['schema'] + '_customers').toDF()
        orders_df = glueContext.create_dynamic_frame_from_catalog(database=args['glue_database'], table_name=args['schema'] + '_orders').toDF()

        # Perform transformations for the customers table
        customers_df.createOrReplaceTempView('customers')
        customers_adjusted = spark.sql('SELECT uuid() AS id, customers.id AS old_id, username, first_name, last_name FROM customers')
        customers_adjusted.createOrReplaceTempView('customers')

        # Perform transformations for the orders table
        orders_df.createOrReplaceTempView('orders')
        orders_adjusted = spark.sql('SELECT uuid() AS id, orders.id AS old_id, customer_id as old_customer_id, order_date, order_timestamp, product_details, quantity, unit_cost, unit_weight FROM orders')

        orders_adjusted = orders_adjusted.withColumn('order_timestamp', to_timestamp(col('order_timestamp')))
        orders_adjusted = orders_adjusted.withColumn('order_date', to_date(col('order_date')))

        # Fix foreign key relationship between orders and customers
        orders_adjusted.createOrReplaceTempView('orders')
        orders_final = spark.sql('select o.id, c.id as customer_id, o.order_date, o.order_timestamp, o.product_details, o.quantity, o.unit_cost, o.unit_weight from orders o inner join customers c on o.old_customer_id = c.old_id')

        customers_adjusted = customers_adjusted.drop('old_id')

        # Fetch token for authorization
        jdbc_url = 'jdbc:postgresql://' + args['dsql_endpoint'] + ':5432/postgres?sslmode=require'
        password = dsql.generate_db_connect_admin_auth_token(args['dsql_endpoint'], ExpiresIn=28800)

        # Write tables to DSQL
        customers_adjusted.write \
            .format('jdbc') \
            .mode('append') \
            .option('url', jdbc_url) \
            .option('dbtable', 'sales.customers') \
            .option('user', 'admin') \
            .option("password", password) \
            .option('sslmode', 'require') \
            .option('isolationLevel', 'NONE') \
            .option('batchsize', '2500') \
            .option('stringtype', 'unspecified') \
            .save()
            
        orders_final.write \
            .format('jdbc') \
            .mode('append') \
            .option('url', jdbc_url) \
            .option('dbtable', 'sales.orders') \
            .option('user', 'admin') \
            .option('password', password) \
            .option('sslmode', 'require') \
            .option('isolationLevel', 'NONE') \
            .option('batchsize', '2500') \
            .option('stringtype', 'unspecified') \
            .save()
            
        job.commit()

  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      EnableKeyRotation: true
      # @secure_recommendation: Explicit key policy restricting access to only the roles that need it
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowSnapshotExportRole
            Effect: Allow
            Principal:
              AWS: !GetAtt SnapshotExportRole.Arn
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
              - kms:CreateGrant
              - kms:DescribeKey
              - kms:RetireGrant
            Resource: "*"
          - Sid: AllowGlueRole
            Effect: Allow
            Principal:
              AWS: !GetAtt GlueRole.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"

  SnapshotExportPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: SnapshotExportPolicy
      RoleName: !Ref SnapshotExportRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # @secure_recommendation: Explicit S3 actions instead of wildcards to minimize privileges
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !GetAtt ExportBucket.Arn
              - !Sub '${ExportBucket.Arn}/*'
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
              - kms:CreateGrant
              - kms:DescribeKey
              - kms:RetireGrant
            Resource:
              - !GetAtt KmsKey.Arn

  SnapshotExportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "export.rds.amazonaws.com"
            Action:
              - "sts:AssumeRole"

  GlueRolePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: GlueRolePolicy
      RoleName: !Ref GlueRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dsql:DbConnectAdmin
            Resource:
              - !Ref DSQLClusterArn
          - Effect: Allow
            Action:
              - s3:List*
              - s3:Get*
            Resource:
              - !GetAtt ExportBucket.Arn
              - !Sub '${ExportBucket.Arn}/*'
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !GetAtt KmsKey.Arn
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:AssociateKmsKey
            Resource: 
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/'
          - Effect: Allow
            Action:
              - glue:GetDatabase
              - glue:GetDatabases
              - glue:GetTable
              - glue:GetTables
              - glue:GetPartition
              - glue:GetPartitions
              - glue:GetColumnStatisticsForTable
              - glue:GetColumnStatisticsForPartition
              - glue:SearchTables
            Resource: 
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${SourceDatabaseName}'
              - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${SourceDatabaseName}/*'

  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "glue.amazonaws.com"
            Action:
              - "sts:AssumeRole"  

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref SourceDatabaseName
      DatabaseInput:
        Description: !Sub 'Exported ${SourceDatabaseName} data'
        Name: !Ref SourceDatabaseName

  CustomersCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      DatabaseName: !Ref GlueDatabase
      Name: customers
      Role: !Ref GlueRole
      Targets:
        S3Targets:
          - Path: !Sub 's3://${ExportBucket}/${ExportJobName}/${GlueDatabase}/${SourceSchemaName}.customers'
            Exclusions: 
              - '_SUCCESS'

  OrdersCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      DatabaseName: !Ref GlueDatabase
      Name: orders
      Role: !Ref GlueRole
      Targets:
        S3Targets:
          - Path: !Sub 's3://${ExportBucket}/${ExportJobName}/${GlueDatabase}/${SourceSchemaName}.orders'
            Exclusions: 
              - '_SUCCESS'

  DSQLLoaderJob:
    Type: AWS::Glue::Job
    Properties:
      Name: storefront-snapshot-dsql-loader
      Description: Loads data from the exported Aurora PostgreSQL snapshot into Amazon Aurora DSQL
      Command:
        Name: glueetl
        PythonVersion: 3
        ScriptLocation: !GetAtt PutGlueJobCodeToS3.S3Url
      GlueVersion: 5.1
      MaxCapacity:  !Ref LoaderJobCapacity
      Role: !GetAtt GlueRole.Arn
      DefaultArguments:
        #'--additional-python-modules': 'boto3>=1.35.95'
        '--dsql_endpoint': !Ref DSQLClusterEndpoint
        '--glue_database': !Ref SourceDatabaseName
        '--schema': !Ref SourceSchemaName


Outputs:
  BucketName:
    Description: The name of the S3 bucket used to export the snapshot to
    Value: !Ref ExportBucket
    
  KmsKeyArn:
    Description: The ARN of the KMS key created for the database snapshot export
    Value: !GetAtt KmsKey.Arn

  SnapshotExportRoleArn:
    Description: The ARN of the IAM role for the database snapshot export into S3
    Value: !GetAtt SnapshotExportRole.Arn

  GlueRoleName:
    Description: The name of the IAM role for the glue crawlers and ETL job
    Value: !Ref GlueRole

  GlueRoleArn:
    Description: The ARN of the IAM role for the glue crawlers and ETL job
    Value: !GetAtt GlueRole.Arn

  GlueJobName:
    Description: The name of the Glue job
    Value:  !Ref DSQLLoaderJob
